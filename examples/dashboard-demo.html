<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPI Dashboard</title>
<style>
  /* ============ Design tokens (validated reference palette) ============ */
  :root {
    color-scheme: light;
    --page:          #f9f9f7;
    --surface-1:     #fcfcfb;
    --text-primary:  #0b0b0b;
    --text-secondary:#52514e;
    --text-muted:    #898781;
    --grid:          #e1e0d9;
    --baseline:      #c3c2b7;
    --border:        rgba(11,11,11,0.10);
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --area-1: rgba(42,120,214,0.10);
    --delta-good: #006300;
    --delta-bad:  #d03b3b;
    --tooltip-bg: #fcfcfb;
    --wash: rgba(11,11,11,0.045);
    --spark: #c3c2b7;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:          #0d0d0d;
    --surface-1:     #1a1a19;
    --text-primary:  #ffffff;
    --text-secondary:#c3c2b7;
    --text-muted:    #898781;
    --grid:          #2c2c2a;
    --baseline:      #383835;
    --border:        rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --area-1: rgba(57,135,229,0.12);
    --delta-good: #0ca30c;
    --delta-bad:  #d03b3b;
    --tooltip-bg: #232322;
    --wash: rgba(255,255,255,0.06);
    --spark: #565551;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    font-size: 14px;
    line-height: 1.45;
  }
  .shell { max-width: 1200px; margin: 0 auto; padding: 28px 24px 48px; }

  /* ============ Header ============ */
  header.dash { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
  header.dash h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
  header.dash .subtitle { color: var(--text-secondary); margin-top: 2px; }
  .header-meta { display: flex; align-items: center; gap: 10px; }
  .period-label { color: var(--text-muted); font-size: 13px; white-space: nowrap; }
  .theme-toggle {
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .theme-toggle:hover { background: var(--wash); }

  /* ============ Filter row ============ */
  .filters { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-1); padding: 3px; gap: 2px; }
  .segmented button {
    border: 0; background: transparent; color: var(--text-secondary); font: inherit; font-size: 13px;
    padding: 5px 12px; border-radius: 6px; cursor: pointer;
  }
  .segmented button:hover { background: var(--wash); }
  .segmented button[aria-pressed="true"] { background: var(--wash); color: var(--text-primary); font-weight: 600; }
  .filters .hint { color: var(--text-muted); font-size: 13px; }

  /* ============ Cards & grid ============ */
  .kpi-grid { display: grid; --kpi-cols: 4; grid-template-columns: repeat(var(--kpi-cols), 1fr); gap: 14px; margin-bottom: 14px; }
  @media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .kpi-grid { grid-template-columns: 1fr; } }
  .charts-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; min-width: 0;
  }
  .card h2 { font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .card .card-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 1px; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .table-toggle {
    border: 0; background: none; color: var(--text-muted); font: inherit; font-size: 12.5px;
    cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 2px 0; white-space: nowrap;
  }
  .table-toggle:hover { color: var(--text-secondary); }
  .span-8 { grid-column: span 8; } .span-6 { grid-column: span 6; }
  .span-4 { grid-column: span 4; } .span-12 { grid-column: span 12; }
  @media (max-width: 900px) { .span-8, .span-6, .span-4 { grid-column: span 12; } }

  /* ============ Stat tiles ============ */
  .tile .label { font-size: 13px; color: var(--text-secondary); }
  .tile .value { font-size: 27px; font-weight: 650; letter-spacing: -0.01em; margin-top: 4px; }
  .tile .delta { font-size: 12.5px; margin-top: 3px; display: flex; align-items: baseline; gap: 5px; }
  .tile .delta .arrow { font-weight: 700; }
  .tile .delta .vs { color: var(--text-muted); }
  .delta-good { color: var(--delta-good); }
  .delta-bad { color: var(--delta-bad); }
  .delta-flat { color: var(--text-muted); }
  .tile svg.spark { display: block; margin-top: 10px; width: 100%; height: 34px; }

  /* ============ Chart plumbing ============ */
  .plot-wrap { position: relative; }
  .plot-wrap svg { display: block; width: 100%; height: auto; }
  .chart-tooltip {
    position: absolute; pointer-events: none; z-index: 5; display: none;
    background: var(--tooltip-bg); border: 1px solid var(--border); border-radius: 9px;
    padding: 8px 11px; min-width: 130px; box-shadow: 0 4px 14px rgba(0,0,0,0.13);
    font-size: 12.5px;
  }
  .chart-tooltip .tt-title { color: var(--text-muted); font-size: 12px; margin-bottom: 5px; }
  .chart-tooltip .tt-row { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
  .chart-tooltip .tt-key { width: 12px; height: 0; border-top: 3px solid; border-radius: 2px; flex: none; }
  .chart-tooltip .tt-val { font-weight: 650; color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .chart-tooltip .tt-name { color: var(--text-secondary); }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; }
  .legend .item { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-secondary); }
  .legend .key-line { width: 14px; height: 0; border-top: 3px solid; border-radius: 2px; }
  .legend .key-rect { width: 11px; height: 11px; border-radius: 3px; }

  svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .axis-text { fill: var(--text-muted); font-size: 11.5px; }
  .end-label { fill: var(--text-secondary); font-size: 11.5px; font-weight: 600; }
  .bar-label { fill: var(--text-secondary); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ============ Data tables ============ */
  .data-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 13px; }
  .data-table th {
    text-align: left; color: var(--text-muted); font-weight: 500; font-size: 12px;
    padding: 6px 10px 6px 0; border-bottom: 1px solid var(--grid);
  }
  .data-table td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--grid); }
  .data-table tr:last-child td { border-bottom: 0; }
  .data-table .num { text-align: right; font-variant-numeric: tabular-nums; }
  .data-table th.num { text-align: right; }
  .table-view { display: none; max-height: 300px; overflow: auto; }
  .card[data-view="table"] .table-view { display: block; }
  .card[data-view="table"] .plot-view { display: none; }

  footer.dash { margin-top: 22px; color: var(--text-muted); font-size: 12.5px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
</style>

<script>
"use strict";
/* ================================================================
   KPI Dashboard runtime — self-contained, no external dependencies.
   Reads #dashboard-config JSON and renders tiles, charts and tables.
   ================================================================ */
(function () {
  const CFG = JSON.parse(document.getElementById("dashboard-config").textContent);
  const $ = (sel, el) => (el || document).querySelector(sel);
  const SVGNS = "http://www.w3.org/2000/svg";

  /* ---------- theme ---------- */
  const root = document.documentElement;
  const savedTheme = localStorage.getItem("kpi-dash-theme");
  const osDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = savedTheme || (osDark ? "dark" : "light");
  $("#theme-toggle").addEventListener("click", () => {
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    localStorage.setItem("kpi-dash-theme", root.dataset.theme);
    render();
  });
  const cssVar = (name) => getComputedStyle(root).getPropertyValue(name).trim();

  /* ---------- formatting ---------- */
  const LOCALE = CFG.locale || "es-MX";
  const CURRENCY = CFG.currency || "USD";
  function fmtValue(v, unit, compact) {
    if (v == null || isNaN(v)) return "—";
    if (unit === "percent") return v.toLocaleString(LOCALE, { maximumFractionDigits: 1 }) + "%";
    if (compact && Math.abs(v) >= 10000) {
      const num = v.toLocaleString(LOCALE, { notation: "compact", maximumFractionDigits: 1 });
      return unit === "currency" ? "$" + num : num;
    }
    const opts = { maximumFractionDigits: Math.abs(v) < 100 && !Number.isInteger(v) ? 1 : 0 };
    if (unit === "currency") { opts.style = "currency"; opts.currency = CURRENCY; }
    return v.toLocaleString(LOCALE, opts);
  }
  function fmtAxis(v, unit) { return fmtValue(v, unit, true); }
  const fmtDate = (iso, o) => new Date(iso + "T00:00:00").toLocaleDateString(LOCALE, o || { day: "numeric", month: "short" });

  /* ---------- data ---------- */
  const DATES = CFG.dates;
  const N = DATES.length;
  const RANGES = [
    { key: "7d", label: "7 días", days: 7 },
    { key: "30d", label: "30 días", days: 30 },
    { key: "90d", label: "90 días", days: 90 },
    { key: "all", label: "Todo", days: N },
  ].filter(r => r.days <= N || r.key === "all");
  let activeRange = CFG.defaultRange || "30d";
  if (!RANGES.some(r => r.key === activeRange)) activeRange = RANGES[RANGES.length - 1].key;

  function windowIdx() {
    const days = RANGES.find(r => r.key === activeRange).days;
    const from = Math.max(0, N - days);
    return { from, to: N, prevFrom: Math.max(0, from - days), prevTo: from };
  }
  const slice = (arr, a, b) => arr.slice(a, b);
  function aggregate(values, how) {
    if (!values.length) return null;
    if (how === "last") return values[values.length - 1];
    const sum = values.reduce((s, v) => s + v, 0);
    return how === "avg" ? sum / values.length : sum;
  }
  function bucket(values, k) {
    if (values.length <= k) return values.slice();
    const out = [];
    for (let i = 0; i < k; i++) {
      const a = Math.floor(i * values.length / k), b = Math.floor((i + 1) * values.length / k);
      const seg = values.slice(a, Math.max(b, a + 1));
      out.push(seg.reduce((s, v) => s + v, 0) / seg.length);
    }
    return out;
  }
  function niceTicks(max) {
    if (max <= 0) return [0, 1];
    const raw = max / 4;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => max / s <= 4.5) || 10 * mag;
    const ticks = [];
    for (let v = 0; v <= max + 1e-9; v += step) ticks.push(v);
    if (ticks[ticks.length - 1] < max) ticks.push(ticks[ticks.length - 1] + step);
    return ticks;
  }

  /* ---------- svg helpers ---------- */
  function el(name, attrs, parent) {
    const node = document.createElementNS(SVGNS, name);
    for (const k in attrs) node.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(node);
    return node;
  }
  function roundedTopRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h);
    return `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h} Z`;
  }
  const seriesColor = (i) => cssVar(`--series-${(i % 3) + 1}`);

  /* ---------- KPI tiles ---------- */
  function renderTiles() {
    const grid = $("#kpi-grid");
    grid.textContent = "";
    /* columnas balanceadas: sin tiles huérfanos en la última fila */
    const n = CFG.kpis.length;
    grid.style.setProperty("--kpi-cols", n <= 4 ? n : n % 4 === 0 ? 4 : n % 3 === 0 ? 3 : 4);
    const { from, to, prevFrom, prevTo } = windowIdx();
    for (const kpi of CFG.kpis) {
      const cur = aggregate(slice(kpi.series, from, to), kpi.aggregate || "sum");
      const prev = prevTo > prevFrom ? aggregate(slice(kpi.series, prevFrom, prevTo), kpi.aggregate || "sum") : null;
      const tile = document.createElement("div");
      tile.className = "card tile";
      const label = document.createElement("div");
      label.className = "label"; label.textContent = kpi.label; tile.appendChild(label);
      const value = document.createElement("div");
      value.className = "value"; value.textContent = fmtValue(cur, kpi.unit, true); tile.appendChild(value);

      const delta = document.createElement("div");
      delta.className = "delta";
      if (prev != null && prev !== 0) {
        /* KPIs en % comparan en puntos porcentuales; el resto, en cambio relativo */
        const isPct = kpi.unit === "percent";
        const pct = isPct ? cur - prev : (cur - prev) / Math.abs(prev) * 100;
        const goodUp = (kpi.goodDirection || "up") === "up";
        const cls = Math.abs(pct) < 0.05 ? "delta-flat" : ((pct > 0) === goodUp ? "delta-good" : "delta-bad");
        const arrow = document.createElement("span");
        arrow.className = "arrow " + cls;
        arrow.textContent = pct > 0 ? "▲" : pct < 0 ? "▼" : "◆";
        const num = document.createElement("span");
        num.className = cls;
        num.textContent = (pct > 0 ? "+" : "") + pct.toLocaleString(LOCALE, { maximumFractionDigits: 1 }) + (isPct ? " pp" : "%");
        const vs = document.createElement("span");
        vs.className = "vs"; vs.textContent = "vs periodo anterior";
        delta.append(arrow, num, vs);
      } else {
        const vs = document.createElement("span");
        vs.className = "vs"; vs.textContent = "sin periodo de comparación";
        delta.appendChild(vs);
      }
      tile.appendChild(delta);

      /* sparkline: 12 buckets, de-emphasis stroke, accent end-dot */
      const pts = bucket(slice(kpi.series, from, to), 12);
      const W = 200, H = 34, PAD = 3;
      const svg = el("svg", { class: "spark", viewBox: `0 0 ${W} ${H}`, "aria-hidden": "true" });
      const min = Math.min(...pts), max = Math.max(...pts), span = max - min || 1;
      const px = (i) => PAD + i * (W - 2 * PAD) / (pts.length - 1 || 1);
      const py = (v) => H - PAD - (v - min) / span * (H - 2 * PAD);
      const d = pts.map((v, i) => (i ? "L" : "M") + px(i).toFixed(1) + "," + py(v).toFixed(1)).join(" ");
      el("path", { d, fill: "none", stroke: cssVar("--spark"), "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }, svg);
      const lastX = px(pts.length - 1), lastY = py(pts[pts.length - 1]);
      el("circle", { cx: lastX, cy: lastY, r: 4.5, fill: cssVar("--surface-1") }, svg);
      el("circle", { cx: lastX, cy: lastY, r: 3, fill: seriesColor(0) }, svg);
      tile.appendChild(svg);
      grid.appendChild(tile);
    }
  }

  /* ---------- tooltip helper ---------- */
  function makeTooltip(wrap) {
    const tt = document.createElement("div");
    tt.className = "chart-tooltip";
    wrap.appendChild(tt);
    return {
      node: tt,
      show(x, y, title, rows) {
        tt.textContent = "";
        const t = document.createElement("div");
        t.className = "tt-title"; t.textContent = title; tt.appendChild(t);
        for (const r of rows) {
          const row = document.createElement("div");
          row.className = "tt-row";
          const key = document.createElement("span");
          key.className = "tt-key"; key.style.borderTopColor = r.color; row.appendChild(key);
          const val = document.createElement("span");
          val.className = "tt-val"; val.textContent = r.value; row.appendChild(val);
          const name = document.createElement("span");
          name.className = "tt-name"; name.textContent = r.name; row.appendChild(name);
          tt.appendChild(row);
        }
        tt.style.display = "block";
        const wrapW = wrap.clientWidth, ttW = tt.offsetWidth, ttH = tt.offsetHeight;
        let left = x + 14;
        if (left + ttW > wrapW - 4) left = x - ttW - 14;
        tt.style.left = Math.max(4, left) + "px";
        tt.style.top = Math.max(4, Math.min(y - ttH / 2, wrap.clientHeight - ttH - 4)) + "px";
      },
      hide() { tt.style.display = "none"; },
    };
  }

  /* ---------- line chart card ---------- */
  function renderLineCard(card, chart) {
    const { from, to } = windowIdx();
    let dates = slice(DATES, from, to);
    let series = chart.series.map((s, i) => {
      const kpi = CFG.kpis.find(k => k.id === s.kpi);
      return { name: s.name || (kpi && kpi.label) || s.kpi, values: slice(s.values || (kpi ? kpi.series : []), from, to), color: seriesColor(i) };
    });
    const unit = chart.unit || "number";

    /* rangos largos: agregar a promedio semanal para que la línea cuente la
       tendencia y no el ruido diario */
    const weekly = dates.length > 60;
    if (weekly) {
      const wDates = [], chunks = [];
      for (let a = 0; a < dates.length; a += 7) {
        wDates.push(dates[a]);
        chunks.push([a, Math.min(a + 7, dates.length)]);
      }
      series = series.map(s => ({
        ...s,
        values: chunks.map(([a, b]) => s.values.slice(a, b).reduce((x, y) => x + y, 0) / (b - a)),
      }));
      dates = wDates;
    }
    const ttTitle = (i, long) => (weekly ? "Semana del " : "") + fmtDate(dates[i], long ? { day: "numeric", month: "short", year: "numeric" } : undefined);

    const plotView = $(".plot-view", card);
    plotView.textContent = "";
    const wrap = document.createElement("div");
    wrap.className = "plot-wrap";
    plotView.appendChild(wrap);

    const W = 640, H = 260, M = { top: 14, right: 74, bottom: 26, left: 46 };
    const iw = W - M.left - M.right, ih = H - M.top - M.bottom;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": chart.title });
    wrap.appendChild(svg);

    const maxVal = Math.max(...series.flatMap(s => s.values), 0);
    const ticks = niceTicks(maxVal);
    const yMax = ticks[ticks.length - 1];
    const X = (i) => M.left + (dates.length > 1 ? i * iw / (dates.length - 1) : iw / 2);
    const Y = (v) => M.top + ih - v / yMax * ih;

    for (const t of ticks) {
      el("line", { x1: M.left, x2: M.left + iw, y1: Y(t), y2: Y(t), stroke: t === 0 ? cssVar("--baseline") : cssVar("--grid"), "stroke-width": 1 }, svg);
      el("text", { x: M.left - 8, y: Y(t) + 4, "text-anchor": "end", class: "axis-text" }, svg).textContent = fmtAxis(t, unit);
    }
    const nLabels = Math.min(6, dates.length);
    for (let j = 0; j < nLabels; j++) {
      const i = Math.round(j * (dates.length - 1) / (nLabels - 1 || 1));
      el("text", { x: X(i), y: H - 6, "text-anchor": "middle", class: "axis-text" }, svg).textContent = fmtDate(dates[i]);
    }

    const crosshair = el("line", { y1: M.top, y2: M.top + ih, stroke: cssVar("--baseline"), "stroke-width": 1, visibility: "hidden" }, svg);

    series.forEach((s) => {
      const d = s.values.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1)).join(" ");
      if (chart.area && series.length === 1) {
        el("path", { d: d + ` L${X(s.values.length - 1)},${Y(0)} L${X(0)},${Y(0)} Z`, fill: cssVar("--area-1"), stroke: "none" }, svg);
      }
      el("path", { d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }, svg);
      const li = s.values.length - 1;
      el("circle", { cx: X(li), cy: Y(s.values[li]), r: 5.5, fill: cssVar("--surface-1") }, svg);
      el("circle", { cx: X(li), cy: Y(s.values[li]), r: 3.5, fill: s.color }, svg);
      el("text", { x: X(li) + 9, y: Y(s.values[li]) + 4, class: "end-label" }, svg).textContent = fmtAxis(s.values[li], unit);
    });

    const dots = series.map(s => {
      const ring = el("circle", { r: 5.5, fill: cssVar("--surface-1"), visibility: "hidden" }, svg);
      const dot = el("circle", { r: 3.5, fill: s.color, visibility: "hidden" }, svg);
      return { ring, dot };
    });

    const tooltip = makeTooltip(wrap);
    const hit = el("rect", { x: M.left, y: M.top, width: iw, height: ih, fill: "transparent" }, svg);
    function onMove(evt) {
      const rect = svg.getBoundingClientRect();
      const sx = (evt.clientX - rect.left) * W / rect.width;
      const i = Math.max(0, Math.min(dates.length - 1, Math.round((sx - M.left) / (iw / (dates.length - 1 || 1)))));
      crosshair.setAttribute("x1", X(i)); crosshair.setAttribute("x2", X(i));
      crosshair.setAttribute("visibility", "visible");
      series.forEach((s, k) => {
        dots[k].ring.setAttribute("cx", X(i)); dots[k].ring.setAttribute("cy", Y(s.values[i])); dots[k].ring.setAttribute("visibility", "visible");
        dots[k].dot.setAttribute("cx", X(i)); dots[k].dot.setAttribute("cy", Y(s.values[i])); dots[k].dot.setAttribute("visibility", "visible");
      });
      const px = X(i) * rect.width / W;
      const py = (evt.clientY - rect.top);
      tooltip.show(px, py, ttTitle(i, true),
        series.map(s => ({ color: s.color, value: fmtValue(s.values[i], unit, true), name: s.name })));
    }
    function onLeave() {
      crosshair.setAttribute("visibility", "hidden");
      dots.forEach(d => { d.ring.setAttribute("visibility", "hidden"); d.dot.setAttribute("visibility", "hidden"); });
      tooltip.hide();
    }
    hit.addEventListener("pointermove", onMove);
    hit.addEventListener("pointerleave", onLeave);

    if (series.length >= 2 || weekly) {
      const legend = document.createElement("div");
      legend.className = "legend";
      if (series.length >= 2) {
        for (const s of series) {
          const item = document.createElement("span");
          item.className = "item";
          const key = document.createElement("span");
          key.className = "key-line"; key.style.borderTopColor = s.color;
          item.appendChild(key); item.appendChild(document.createTextNode(s.name));
          legend.appendChild(item);
        }
      }
      if (weekly) {
        const note = document.createElement("span");
        note.className = "item";
        note.style.color = "var(--text-muted)";
        note.textContent = "Agregado semanal (promedio diario)";
        legend.appendChild(note);
      }
      plotView.appendChild(legend);
    }

    /* table view */
    const tv = $(".table-view", card);
    tv.textContent = "";
    const table = document.createElement("table");
    table.className = "data-table";
    const thead = document.createElement("thead");
    const hr = document.createElement("tr");
    const th0 = document.createElement("th"); th0.textContent = weekly ? "Semana" : "Fecha"; hr.appendChild(th0);
    for (const s of series) { const th = document.createElement("th"); th.className = "num"; th.textContent = s.name; hr.appendChild(th); }
    thead.appendChild(hr); table.appendChild(thead);
    const tbody = document.createElement("tbody");
    for (let i = dates.length - 1; i >= 0; i--) {
      const tr = document.createElement("tr");
      const td0 = document.createElement("td"); td0.textContent = ttTitle(i, true); tr.appendChild(td0);
      for (const s of series) { const td = document.createElement("td"); td.className = "num"; td.textContent = fmtValue(s.values[i], unit, false); tr.appendChild(td); }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    tv.appendChild(table);
  }

  /* ---------- bar chart card ---------- */
  function renderBarCard(card, chart) {
    const { from, to } = windowIdx();
    const unit = chart.unit || "number";
    const rows = chart.categories.map((c, i) => ({
      name: c,
      value: aggregate(slice(chart.values[i], from, to), chart.aggregate || "sum"),
    })).sort((a, b) => b.value - a.value);

    const plotView = $(".plot-view", card);
    plotView.textContent = "";
    const wrap = document.createElement("div");
    wrap.className = "plot-wrap";
    plotView.appendChild(wrap);

    /* horizontal bars: label left, bar, value at tip */
    const W = 320, rowH = 34, M = { left: 4, right: 56, top: 6, bottom: 6 };
    const H = M.top + M.bottom + rows.length * rowH;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": chart.title });
    wrap.appendChild(svg);
    const maxVal = Math.max(...rows.map(r => r.value), 0) || 1;
    const total = rows.reduce((s, r) => s + r.value, 0);
    const labelW = 92;
    const barMax = W - M.left - M.right - labelW;
    const tooltip = makeTooltip(wrap);
    const color = chart.color != null ? seriesColor(chart.color) : seriesColor(0);

    rows.forEach((r, i) => {
      const y = M.top + i * rowH;
      const barY = y + (rowH - 18) / 2;
      const w = Math.max(2, r.value / maxVal * barMax);
      el("text", { x: M.left, y: y + rowH / 2 + 4, class: "axis-text" }, svg).textContent =
        r.name.length > 14 ? r.name.slice(0, 13) + "…" : r.name;
      const bar = el("path", { d: `M${M.left + labelW},${barY} h${Math.max(0, w - 4)} q4,0 4,4 v10 q0,4 -4,4 h${-Math.max(0, w - 4)} z`, fill: color }, svg);
      el("text", { x: M.left + labelW + w + 7, y: barY + 13, class: "bar-label" }, svg).textContent = fmtAxis(r.value, unit);
      /* full-row transparent hit target, bigger than the mark */
      const hit = el("rect", { x: 0, y, width: W, height: rowH, fill: "transparent", tabindex: 0 }, svg);
      const show = (evt) => {
        bar.setAttribute("opacity", "0.82");
        const rect = svg.getBoundingClientRect();
        const px = evt && evt.clientX ? (evt.clientX - rect.left) : (M.left + labelW + w / 2) * rect.width / W;
        const py = (y + rowH / 2) * rect.height / H;
        const share = total > 0 ? (r.value / total * 100).toLocaleString(LOCALE, { maximumFractionDigits: 1 }) + "% del total" : "";
        tooltip.show(px, py, r.name, [{ color, value: fmtValue(r.value, unit, true), name: share || chart.valueLabel || "" }]);
      };
      const hide = () => { bar.setAttribute("opacity", "1"); tooltip.hide(); };
      hit.addEventListener("pointermove", show);
      hit.addEventListener("pointerleave", hide);
      hit.addEventListener("focus", () => show(null));
      hit.addEventListener("blur", hide);
    });

    const totalLine = document.createElement("div");
    totalLine.className = "legend";
    const totalItem = document.createElement("span");
    totalItem.className = "item";
    const strong = document.createElement("strong");
    strong.style.color = "var(--text-primary)";
    strong.textContent = fmtValue(total, unit, true);
    totalItem.append("Total:  ", strong);
    totalLine.appendChild(totalItem);
    plotView.appendChild(totalLine);

    /* table view */
    const tv = $(".table-view", card);
    tv.textContent = "";
    const table = document.createElement("table");
    table.className = "data-table";
    const thead = document.createElement("thead");
    const hr = document.createElement("tr");
    const thA = document.createElement("th"); thA.textContent = chart.categoryLabel || "Categoría";
    const thB = document.createElement("th"); thB.className = "num"; thB.textContent = chart.valueLabel || "Valor";
    const thC = document.createElement("th"); thC.className = "num"; thC.textContent = "% del total";
    hr.append(thA, thB, thC); thead.appendChild(hr); table.appendChild(thead);
    const tbody = document.createElement("tbody");
    for (const r of rows) {
      const tr = document.createElement("tr");
      const td0 = document.createElement("td"); td0.textContent = r.name;
      const td1 = document.createElement("td"); td1.className = "num"; td1.textContent = fmtValue(r.value, unit, false);
      const td2 = document.createElement("td"); td2.className = "num";
      td2.textContent = total > 0 ? (r.value / total * 100).toLocaleString(LOCALE, { maximumFractionDigits: 1 }) + "%" : "—";
      tr.append(td0, td1, td2); tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    tv.appendChild(table);
  }

  /* ---------- chart cards scaffolding ---------- */
  function buildCards() {
    const grid = $("#charts-grid");
    grid.textContent = "";
    for (const chart of CFG.charts) {
      const card = document.createElement("section");
      card.className = "card span-" + (chart.span || (chart.type === "line" ? 8 : 4));
      card.dataset.chart = chart.id;
      const head = document.createElement("div");
      head.className = "card-head";
      const titles = document.createElement("div");
      const h2 = document.createElement("h2"); h2.textContent = chart.title; titles.appendChild(h2);
      if (chart.subtitle) { const sub = document.createElement("div"); sub.className = "card-sub"; sub.textContent = chart.subtitle; titles.appendChild(sub); }
      head.appendChild(titles);
      const toggle = document.createElement("button");
      toggle.type = "button"; toggle.className = "table-toggle"; toggle.textContent = "Ver tabla";
      toggle.addEventListener("click", () => {
        const isTable = card.dataset.view === "table";
        card.dataset.view = isTable ? "plot" : "table";
        toggle.textContent = isTable ? "Ver tabla" : "Ver gráfica";
      });
      head.appendChild(toggle);
      card.appendChild(head);
      const plotView = document.createElement("div"); plotView.className = "plot-view"; card.appendChild(plotView);
      const tableView = document.createElement("div"); tableView.className = "table-view"; card.appendChild(tableView);
      grid.appendChild(card);
    }
  }

  function renderCharts() {
    for (const chart of CFG.charts) {
      const card = $(`[data-chart="${chart.id}"]`);
      if (chart.type === "line") renderLineCard(card, chart);
      else if (chart.type === "bar") renderBarCard(card, chart);
    }
  }

  /* ---------- filters ---------- */
  function renderFilters() {
    const box = $("#range-buttons");
    box.textContent = "";
    for (const r of RANGES) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = r.label;
      b.setAttribute("aria-pressed", String(r.key === activeRange));
      b.addEventListener("click", () => { activeRange = r.key; render(); });
      box.appendChild(b);
    }
    const { from, to } = windowIdx();
    $("#range-hint").textContent = fmtDate(DATES[from], { day: "numeric", month: "short", year: "numeric" }) +
      " – " + fmtDate(DATES[to - 1], { day: "numeric", month: "short", year: "numeric" });
    $("#period-label").textContent = "Comparado con el periodo anterior equivalente";
  }

  /* ---------- header/footer ---------- */
  document.title = CFG.title;
  $("#dash-title").textContent = CFG.title;
  $("#dash-subtitle").textContent = CFG.subtitle || "";
  $("#footer-note").textContent = CFG.footnote || "";
  $("#footer-updated").textContent = "Datos al " + fmtDate(DATES[N - 1], { day: "numeric", month: "long", year: "numeric" });

  function render() {
    renderFilters();
    renderTiles();
    renderCharts();
  }
  buildCards();
  render();
})();
</script>
</body>
</html>
